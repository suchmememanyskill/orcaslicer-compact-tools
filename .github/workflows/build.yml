name: Build plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -B -m unittest discover -s test -v
      - name: Build wheel
        run: python build_plugin.py --output-dir dist
      - name: Upload wheel
        uses: actions/upload-artifact@v7.0.2
        with:
          name: compact-gcode-tools
          path: dist/*.whl
          if-no-files-found: error
